name: Automation Health Check

on:
  schedule:
    # 台灣 09:00 週一至五 — 盤後融合後複查（UTC 01:00）
    - cron: '0 1 * * 1-5'
    # 台灣 07:00 週一至五 — 早上海選前複查（UTC 日～四 23:00）
    - cron: '0 23 * * 0-4'
  push:
    branches: [main]
    paths:
      - 'automation_health.py'
      - 'import_health.py'
      - 'quote_integrity.py'
      - 'data_fetcher.py'
      - 'main_runner.py'
      - 'tests/test_automation_health.py'
      - 'tests/test_quote_integrity.py'
      - 'tests/test_quote_filter_integration.py'
      - 'tests/test_increment_gate.py'
      - '.github/workflows/automation_health.yml'
  workflow_dispatch:

jobs:
  automation-health:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝依賴
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 下載核心資料庫
        run: |
          mkdir -p data
          curl -L -o waynebot_production_complete.zip "https://github.com/wayne05281019/WayneBot/releases/download/v1.0-data/waynebot_production_complete.zip"
          unzip -o waynebot_production_complete.zip -d data_extract
          FOUND=$(find data_extract -name '*.db' -size +1M | head -n 1)
          if [ -n "$FOUND" ]; then
            cp "$FOUND" data/wayne_market.db
          else
            echo "警告：找不到 Release 資料庫"
          fi

      - name: 自動化管線煙霧測試
        env:
          WAYNE_DB_PATH: data/wayne_market.db
        run: |
          python -m pytest -q \
            tests/test_automation_health.py \
            tests/test_quote_integrity.py \
            tests/test_quote_filter_integration.py \
            tests/test_increment_gate.py

      - name: 生產庫自動化巡檢（該有的數字不可為 0）
        env:
          WAYNE_DB_PATH: data/wayne_market.db
        run: |
          python automation_health.py --json || true
          python - <<'PY'
          import json, sys
          from config import fuse_end_date, get_db_path
          from automation_health import run_automation_audit, format_automation_audit_plain

          path = get_db_path()
          cap = fuse_end_date()
          report = run_automation_audit(path, cap=cap, strict_release=False)
          print(format_automation_audit_plain(report))
          print(json.dumps({k: report[k] for k in ("ok", "cap", "latest_complete", "reasons")}, ensure_ascii=False, indent=2))
          # 生產庫允許歷史缺口與 Release 未齊，但當日融合門檻必須過
          inc = (report.get("checks") or {}).get("increment") or {}
          filt = (report.get("checks") or {}).get("quote_filter") or {}
          if not filt.get("ok"):
              sys.exit("過濾器回歸失敗")
          if not inc.get("ok"):
              sys.exit("盤後融合未過關：" + "；".join(inc.get("reasons") or report.get("reasons") or []))
          if report.get("latest_complete") and cap and report["latest_complete"] < cap:
              sys.exit(f"基準日 {report['latest_complete']} 落後可融合日 {cap}")
          print("自動化巡檢通過")
          PY
