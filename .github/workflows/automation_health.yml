name: Automation Health Check

on:
  schedule:
    # 台灣 09:00 週一至五 — 盤後融合後複查（UTC 01:00）
    - cron: '0 1 * * 1-5'
    # 台灣 07:00 週一至五 — 早上海選前複查（UTC 日～四 23:00）
    - cron: '0 23 * * 0-4'
  push:
    branches: [main]
    paths:
      - 'automation_health.py'
      - 'import_health.py'
      - 'quote_integrity.py'
      - 'data_fetcher.py'
      - 'main_runner.py'
      - 'tests/test_automation_health.py'
      - 'tests/test_quote_integrity.py'
      - 'tests/test_quote_filter_integration.py'
      - 'tests/test_increment_gate.py'
      - '.github/workflows/automation_health.yml'
  workflow_dispatch:

jobs:
  automation-health:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝依賴
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: 下載核心資料庫
        run: |
          mkdir -p data
          curl -L -o waynebot_production_complete.zip "https://github.com/wayne05281019/WayneBot/releases/download/v1.0-data/waynebot_production_complete.zip"
          unzip -o waynebot_production_complete.zip -d data_extract
          FOUND=$(find data_extract -name '*.db' -size +1M | head -n 1)
          if [ -n "$FOUND" ]; then
            cp "$FOUND" data/wayne_market.db
          else
            echo "警告：找不到 Release 資料庫"
          fi

      - name: 自動化管線煙霧測試
        env:
          WAYNE_DB_PATH: data/wayne_market.db
        run: |
          python -m pytest -q \
            tests/test_automation_health.py \
            tests/test_quote_integrity.py \
            tests/test_quote_filter_integration.py \
            tests/test_increment_gate.py

      - name: Release 快照基本檢查（push）
        if: github.event_name == 'push'
        env:
          WAYNE_DB_PATH: data/wayne_market.db
        run: |
          python - <<'PY'
          import json, sys
          from config import get_db_path
          from automation_health import verify_release_snapshot

          report = verify_release_snapshot(get_db_path())
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if not report.get("ok"):
              sys.exit("Release 快照未過：" + "；".join(report.get("reasons") or []))
          print("Release 快照檢查通過")
          PY

      - name: 定時全面巡檢（schedule / 手動）
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          WAYNE_DB_PATH: data/wayne_market.db
        run: |
          python - <<'PY'
          import json, sys
          from config import fuse_end_date, get_db_path
          from automation_health import format_automation_audit_plain, verify_scheduled_audit

          path = get_db_path()
          cap = fuse_end_date()
          report = verify_scheduled_audit(path, cap=cap)
          inner = report.get("report") or {}
          print(format_automation_audit_plain(inner))
          print(json.dumps({k: report[k] for k in ("ok", "cap", "latest_complete", "reasons")}, ensure_ascii=False, indent=2))
          if not report.get("ok"):
              sys.exit("定時巡檢未過：" + "；".join(report.get("reasons") or []))
          print("定時巡檢通過")
          PY
