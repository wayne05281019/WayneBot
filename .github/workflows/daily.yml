name: WayneBot Daily Quantitative Screening & Alert

on:
  schedule:
    # 台灣時間 (UTC+8) 每週一至週五 16:30 自動執行 (對應 UTC 08:30)
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 支援手動一鍵測試

jobs:
  run-screening-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境 (Setup Python 3.10)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝依賴套件 (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 執行每日台股量化總控流水線 (Run Main Runner)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python main_runner.py
