name: WayneBot Daily Screening

on:
  schedule:
    # 台灣時間週一至週五 16:30 自動執行 (對應 UTC 08:30)
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 支援手動在網頁上隨時點擊測試

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Download & Unzip Database from Releases
        run: |
          echo "📥 正在從 GitHub Releases 下載核心資料庫..."
          curl -L -o waynebot_production_complete.zip "https://github.com/wayne05281019/WayneBot/releases/download/v1.0-data/waynebot_production_complete.zip"
          unzip -o waynebot_production_complete.zip

      - name: Run WayneBot Screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main_runner.py
