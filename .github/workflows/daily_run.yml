name: WayneBot Daily Screening

on:
  schedule:
    # 台灣時間週一至週五 16:30（UTC 08:30）— 融合後通過完整性才蓋掉 Release zip
    - cron: '30 8 * * 1-5'
    # 台灣時間週一至週五 06:30（UTC 日～四 22:30）— 昨收＋美股收盤／盤後寄海選；大跌先通知
    - cron: '30 22 * * 0-4'
  workflow_dispatch:
    inputs:
      job:
        description: increment=盤後抓數；morning_screen=早上只寄海選
        type: choice
        options:
          - increment
          - morning_screen
        default: increment

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境 (Setup Python 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝依賴套件 (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 決定工作種類
        id: job
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB="${{ github.event.inputs.job }}"
          else
            SCHED="${{ github.event.schedule }}"
            echo "schedule=[$SCHED]"
            case "$SCHED" in
              *22*) JOB="morning_screen" ;;
              *) JOB="increment" ;;
            esac
          fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "本次工作：$JOB"

      - name: 從 Releases 下載核心資料庫 (Download Database)
        run: |
          echo "正在從 GitHub Releases 下載核心資料庫..."
          mkdir -p data
          curl -L -o waynebot_production_complete.zip "https://github.com/wayne05281019/WayneBot/releases/download/v1.0-data/waynebot_production_complete.zip"
          unzip -o waynebot_production_complete.zip -d data_extract
          FOUND=$(find data_extract -name '*.db' -size +1M | head -n 1)
          if [ -n "$FOUND" ]; then
            cp "$FOUND" data/wayne_market.db
            echo "已對齊資料庫 -> data/wayne_market.db"
          else
            echo "警告：zip 內找不到 .db，流水線將建立空白庫"
          fi

      - name: 執行每日工作
        id: run_job
        env:
          WAYNE_JOB: ${{ steps.job.outputs.job }}
          WAYNE_MODE: ${{ steps.job.outputs.job }}
          WAYNE_DB_PATH: data/wayne_market.db
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TG_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py --once

      - name: 盤後匯入硬性關卡（increment 日 K 不可為 0）
        if: always() && steps.job.outputs.job == 'increment'
        run: |
          python - <<'PY'
          import json, sys
          from config import get_db_path, fuse_end_date
          from automation_health import format_automation_audit_plain, run_automation_audit

          path = get_db_path()
          cap = fuse_end_date()
          report = run_automation_audit(path, cap=cap, strict_release=False)
          print("fuse_end", cap)
          print(format_automation_audit_plain(report))
          print(json.dumps(
              {k: report[k] for k in ("ok", "cap", "latest_complete", "reasons") if k in report},
              ensure_ascii=False,
              indent=2,
          ))
          inc = (report.get("checks") or {}).get("increment") or {}
          filt = (report.get("checks") or {}).get("quote_filter") or {}
          if not filt.get("ok"):
              sys.exit("過濾器回歸失敗")
          if not inc.get("ok"):
              sys.exit("盤後匯入未過關：" + "；".join(inc.get("reasons") or []))
          if report.get("latest_complete") and cap and report["latest_complete"] < cap:
              sys.exit(f"基準日 {report['latest_complete']} 落後可融合日 {cap}")
          print("盤後匯入關卡通過")
          PY

      - name: 早上海選硬性關卡（基準日必須齊）
        if: always() && steps.job.outputs.job == 'morning_screen'
        run: |
          python - <<'PY'
          import json, sys
          from config import get_db_path, fuse_end_date
          from automation_health import format_automation_audit_plain, run_automation_audit

          path = get_db_path()
          cap = fuse_end_date()
          report = run_automation_audit(path, cap=cap, strict_release=False, max_gap_days=999)
          print(format_automation_audit_plain(report))
          filt = (report.get("checks") or {}).get("quote_filter") or {}
          if not filt.get("ok"):
              sys.exit("過濾器回歸失敗")
          complete = report.get("latest_complete") or ""
          if not complete:
              sys.exit("沒有上市＋上櫃都齊的基準日，無法寄海選")
          print(json.dumps({"ok": True, "cap": cap, "latest_complete": complete}, ensure_ascii=False))
          print("早上海選關卡通過")
          PY

      - name: 完整性通過才蓋掉舊 Release zip
        if: success() && steps.job.outputs.job == 'increment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f data/wayne_market.db
          python - <<'PY'
          import json, sys
          from import_health import audit_import, can_publish_release, format_audit_plain
          from config import get_db_path, fuse_end_date

          path = get_db_path()
          print(format_audit_plain(audit_import(path)))
          report = can_publish_release(path)
          print("fuse_end", fuse_end_date())
          print(json.dumps({k: report[k] for k in report if k != "quotes"}, ensure_ascii=False, indent=2))
          print("quotes", report.get("quotes"))
          if not report.get("ok"):
              sys.exit("完整性未過，不覆蓋 Release：" + "；".join(report.get("reasons") or []))
          print("完整性通過，蓋掉舊 zip")
          PY
          rm -f waynebot_production_complete.zip
          zip -1 -j waynebot_production_complete.zip data/wayne_market.db
          gh release upload v1.0-data waynebot_production_complete.zip --clobber --repo "${GITHUB_REPOSITORY}"
