name: WayneBot Daily Screening

on:
  schedule:
    # 盤後融合：台灣週一至五 16:30（UTC 08:30）。只抓數、蓋 Release，不寄海選。
    - cron: '30 8 * * 1-5'
    # GitHub 常晚幾分鐘才排到 08:30；08:45 只補跑盤後。不是早上海選。
    - cron: '45 8 * * 1-5'
    # 早上海選：台灣週一至五 06:30（UTC 日～四 22:30）。只准這一條。不要再加帶 22 的備份。
    - cron: '30 22 * * 0-4'
  workflow_dispatch:
    inputs:
      job:
        description: increment=盤後抓數；morning_screen=早上只寄海選
        type: choice
        options:
          - increment
          - morning_screen
        default: increment
  # 機器人無法 workflow_dispatch（403）時，改推 trigger 檔補跑
  push:
    branches: [main]
    paths:
      - '.github/triggers/increment'
      - '.github/triggers/morning_screen'

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4
        with:
          # push 觸發要比 before…sha；預設 depth=1 會讓 changed 變空、誤判成 increment
          fetch-depth: 50

      - name: 設定 Python 環境 (Setup Python 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝依賴套件 (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock ]; then pip install -r requirements.lock; else pip install -r requirements.txt; fi

      - name: 決定工作種類
        id: job
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB="${{ github.event.inputs.job }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            SHA="${{ github.sha }}"
            CHANGED=""
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git diff --name-only "$BEFORE" "$SHA" 2>/dev/null || true)
            fi
            if [ -z "$CHANGED" ]; then
              CHANGED=$(git show --pretty="" --name-only -m --first-parent "$SHA" 2>/dev/null || true)
            fi
            if [ -z "$CHANGED" ]; then
              CHANGED=$(git diff-tree --no-commit-id --name-only -r "$SHA" 2>/dev/null || true)
            fi
            MSG="${{ github.event.head_commit.message }}"
            echo "changed=[$CHANGED]"
            echo "msg_head=$(echo "$MSG" | head -1)"
            if echo "$CHANGED" | grep -q 'triggers/morning_screen' || echo "$MSG" | grep -qi 'morning_screen'; then
              JOB="morning_screen"
            elif echo "$CHANGED" | grep -q 'triggers/increment' || echo "$MSG" | grep -qi 'increment'; then
              JOB="increment"
            else
              # 路徑過濾保證至少一個 trigger；認不出時早上時段偏海選、其餘偏盤後
              HH=$(date -u +%H)
              if [ "$HH" -ge 21 ] || [ "$HH" -lt 6 ]; then
                JOB="morning_screen"
              else
                JOB="increment"
              fi
              echo "WARN: trigger 檔辨識失敗，依 UTC 時段 fallback → $JOB"
            fi
          else
            SCHED="${{ github.event.schedule }}"
            echo "schedule=[$SCHED]"
            # 早上海選只認 22:30 那一條。其餘排程（16:30／16:45）都是盤後，不要寄海選。
            if [ "$SCHED" = "30 22 * * 0-4" ]; then
              JOB="morning_screen"
            else
              JOB="increment"
            fi
          fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "本次工作：$JOB"

      - name: 從 Releases 下載核心資料庫 (Download Database)
        run: |
          echo "正在從 GitHub Releases 下載核心資料庫..."
          mkdir -p data
          curl -L -o waynebot_production_complete.zip "https://github.com/wayne05281019/WayneBot/releases/download/v1.0-data/waynebot_production_complete.zip"
          unzip -o waynebot_production_complete.zip -d data_extract
          FOUND=$(find data_extract -name '*.db' -size +1M | head -n 1)
          if [ -n "$FOUND" ]; then
            cp "$FOUND" data/wayne_market.db
            echo "已對齊資料庫 -> data/wayne_market.db"
          else
            echo "警告：zip 內找不到 .db，流水線將建立空白庫"
          fi

      # GHA 只算名單／蓋 zip，不寄 Telegram。不要注入 token，過期 GitHub Secret 才不會 401。
      - name: 執行每日工作
        id: run_job
        env:
          WAYNE_JOB: ${{ steps.job.outputs.job }}
          WAYNE_MODE: ${{ steps.job.outputs.job }}
          WAYNE_DB_PATH: data/wayne_market.db
          WAYNE_SCREEN_NOTIFY: "0"
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py --once

      - name: 盤後匯入硬性關卡（increment 日 K 不可為 0）
        if: always() && steps.job.outputs.job == 'increment'
        run: |
          python - <<'PY'
          import json, sys
          from config import get_db_path, fuse_end_date
          from automation_health import format_automation_audit_plain, run_automation_audit

          path = get_db_path()
          cap = fuse_end_date()
          report = run_automation_audit(path, cap=cap, strict_release=False)
          print("fuse_end", cap)
          print(format_automation_audit_plain(report))
          print(json.dumps(
              {k: report[k] for k in ("ok", "cap", "latest_complete", "reasons") if k in report},
              ensure_ascii=False,
              indent=2,
          ))
          inc = (report.get("checks") or {}).get("increment") or {}
          filt = (report.get("checks") or {}).get("quote_filter") or {}
          if not filt.get("ok"):
              sys.exit("過濾器回歸失敗")
          if not inc.get("ok"):
              sys.exit("盤後匯入未過關：" + "；".join(inc.get("reasons") or []))
          if report.get("latest_complete") and cap and report["latest_complete"] < cap:
              sys.exit(f"基準日 {report['latest_complete']} 落後可融合日 {cap}")
          print("盤後匯入關卡通過")
          PY

      - name: 早上海選硬性關卡（基準日必須齊）
        if: always() && steps.job.outputs.job == 'morning_screen'
        run: |
          python - <<'PY'
          import json, sys
          from config import get_db_path, fuse_end_date
          from automation_health import format_automation_audit_plain, run_automation_audit

          path = get_db_path()
          cap = fuse_end_date()
          report = run_automation_audit(path, cap=cap, strict_release=False, max_gap_days=999)
          print(format_automation_audit_plain(report))
          filt = (report.get("checks") or {}).get("quote_filter") or {}
          if not filt.get("ok"):
              sys.exit("過濾器回歸失敗")
          complete = report.get("latest_complete") or ""
          if not complete:
              sys.exit("沒有上市＋上櫃都齊的基準日，無法寄海選")
          print(json.dumps({"ok": True, "cap": cap, "latest_complete": complete}, ensure_ascii=False))
          print("早上海選關卡通過")
          PY

      # 早上海選只驗基準日齊。Release zip 只准盤後 increment 蓋，上傳前清私人表。

      - name: 完整性通過才蓋掉舊 Release zip
        if: success() && steps.job.outputs.job == 'increment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f data/wayne_market.db
          python - <<'PY'
          import json, sys
          from import_health import audit_import, can_publish_release, format_audit_plain
          from config import get_db_path, fuse_end_date

          path = get_db_path()
          print(format_audit_plain(audit_import(path)))
          report = can_publish_release(path)
          print("fuse_end", fuse_end_date())
          print(json.dumps({k: report[k] for k in report if k != "quotes"}, ensure_ascii=False, indent=2))
          print("quotes", report.get("quotes"))
          if not report.get("ok"):
              sys.exit("完整性未過，不覆蓋 Release：" + "；".join(report.get("reasons") or []))
          print("完整性通過，蓋掉舊 zip")
          PY
          python - <<'PY'
          from wayne_db import strip_private_user_data
          from config import get_db_path

          deleted = strip_private_user_data(get_db_path())
          print("stripped_private", deleted)
          PY
          rm -f waynebot_production_complete.zip
          zip -1 -j waynebot_production_complete.zip data/wayne_market.db
          gh release upload v1.0-data waynebot_production_complete.zip --clobber --repo "${GITHUB_REPOSITORY}"
