name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tier-a-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝依賴
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Tier A 煙霧測試（不需 DB）
        run: |
          python -m pytest -q \
            tests/test_automation_health.py \
            tests/test_increment_gate.py \
            tests/test_quote_integrity.py \
            tests/test_quote_filter_integration.py \
            tests/test_trading_calendar.py \
            tests/test_db_integrity.py \
            tests/test_main_runner_screen.py
