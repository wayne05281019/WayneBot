name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同分支／同 PR 新推碼就取消舊跑，避免多 agent 疊滿 runner 把合主卡住
concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 快篩：只跑 smoke marker（自動掛給非出圖／非長測單元）；理想 ≤10–15 分。
  # 出圖／PNG／大盤渲圖／stress／e2e 掛 render|slow，只進 full-suite。
  smoke-no-db:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝依賴
        run: |
          python -m pip install --upgrade pip
          # PyPI 偶發回 versions: none；整段重跑才會再打 index
          ok=0
          for i in 1 2 3 4 5; do
            if pip install --retries 10 --timeout 60 -r requirements.lock pytest; then
              ok=1
              break
            fi
            echo "pip install failed attempt=$i; retrying..."
            sleep $((i * 4))
          done
          test "$ok" = 1
          python -c "import kiwisolver, matplotlib; print('deps ok', kiwisolver.__version__)"

      - name: smoke 快篩（非出圖／非長測）
        # 舊式 -m "not production_db" ≈4350 測含大量出圖，單職可 >60 分。
        # 現改 -m smoke（conftest 依檔名自動掛；見 tests/smoke_classify.py）。
        # 不加 per-test timeout：會誤殺會打官方 ISIN 外網的測（見 #501 3m52s 紅）
        # 外網掛死主因：conftest stub MOPS／_post_form／月表（查股 ensure→SSL→executor 300s）
        # 整 job 仍有 timeout-minutes:25；真掛靠 concurrency 取消重跑
        run: python -m pytest -q --strict-markers -m smoke --durations=25

  # 完整訊號：抓 Release 庫，跑包含選單、決策卡、出圖、大盤頁的全套。
  # 只跑煙霧測試的話，回歸會安靜地合併進 main 再部署上去。
  # needs smoke：同一 PR 不准 smoke／full 並搶兩席（24 PR 排隊時峰值約腰斬）；
  # smoke 紅就不開 full，省 runner。仍兩職都綠才合（對齊 #969）。
  # 詳見 docs/ci_queue_concurrency_strategy_20261123.md
  # full-suite：預設全跑。僅「這一推」全是黃培碩筆記／分數板／結案稿時跳過 DB＋pytest，
  # 職名仍叫 full-suite 且 success（避免 required check 卡住）。任何 .py／tests／_TEMPLATE／
  # workflow／requirements → 必跑。跳過綠≠證明未測 Python；合主仍要碼變過的 tip 真全綠。
  full-suite:
    needs: smoke-no-db
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # PR checkout 預設是 merge commit；不准用 HEAD~1（會把整包 PR diff 當「這一推」）。
      # synchronize：比 github.event.before → pull_request.head.sha（真·這一推）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect Huang-notes-only push
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess, unicodedata
          from pathlib import Path

          def allowlisted(path: str) -> bool:
              p = unicodedata.normalize("NFC", path.replace("\\", "/"))
              if p == "docs/expert_notes/黃培碩/huang_days/_TEMPLATE.json":
                  return False
              if p.startswith("docs/expert_notes/黃培碩/huang_days/"):
                  return True
              if p.startswith("docs/expert_notes/黃培碩/huang_chrono_"):
                  return True
              if p in {
                  "docs/expert_notes/黃培碩/huang_scoreboard.json",
                  "docs/expert_notes/黃培碩/huang_stock_quant_ledger.json",
                  "docs/expert_notes/黃培碩/huang_vnext_candidates.json",
                  "docs/expert_notes/黃培碩/huang_judgment_principles_quant.json",
                  "docs/expert_notes/黃培碩/huang_film_index.json",
                  "docs/expert_notes/黃培碩/huang_sample_register.json",
              }:
                  return True
              if p.startswith("docs/expert_notes/黃培碩/") and p.endswith(".md"):
                  return True
              return False

          def names_only(a: str, b: str | None = None) -> list[str]:
              cmd = ["git", "diff", "--name-only", a] if b is None else ["git", "diff", "--name-only", a, b]
              out = subprocess.check_output(cmd, text=True)
              return [unicodedata.normalize("NFC", ln.strip()) for ln in out.splitlines() if ln.strip()]

          event = os.environ.get("EVENT_NAME", "")
          before = (os.environ.get("BEFORE_SHA") or "").strip()
          base = (os.environ.get("BASE_SHA") or "").strip()
          head = (os.environ.get("HEAD_SHA") or "").strip()
          changed: list[str] = []
          mode = "empty"
          # 1) synchronize／push：真·這一推 before→head
          if before and before != "0" * 40 and head:
              subprocess.run(["git", "fetch", "--no-tags", "origin", before, head], check=False)
              try:
                  changed = names_only(before, head)
                  mode = "before→head"
              except subprocess.CalledProcessError:
                  changed = []
                  mode = "before→head_fail"
          # 2) PR opened／before 缺：比 base→head（整包 PR；筆記-only 仍可跳）
          if not changed and event == "pull_request" and base and head:
              subprocess.run(["git", "fetch", "--no-tags", "origin", base, head], check=False)
              try:
                  changed = names_only(base, head)
                  mode = "base→head"
              except subprocess.CalledProcessError:
                  changed = []
                  mode = "base→head_fail"
          # 3) 最後：只列 tip 提交檔（不需父提交；修 HEAD~1 在 detached tip 空 diff）
          if not changed:
              try:
                  out = subprocess.check_output(
                      ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"],
                      text=True,
                  )
                  changed = [
                      unicodedata.normalize("NFC", ln.strip())
                      for ln in out.splitlines()
                      if ln.strip()
                  ]
                  mode = "diff-tree_HEAD"
              except subprocess.CalledProcessError:
                  changed = []
                  mode = "diff-tree_fail"

          print(f"gate mode={mode} before={before[:12] or '-'} base={base[:12] or '-'} head={head[:12] or '-'}")
          print("changed files:")
          for f in changed:
              print(f)
          if not changed:
              need = 1
              print("empty diff → need full-suite")
          else:
              need = 0 if all(allowlisted(f) for f in changed) else 1
              print(
                  "Huang notes-only push → skip DB/pytest"
                  if need == 0
                  else "code/contract-relevant paths → run full-suite"
              )
          Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8").write(
              f"need_full={need}\n"
          )
          PY

      - name: Huang notes-only skip (full-suite stays green)
        if: steps.gate.outputs.need_full != '1'
        run: |
          echo "skipped full pytest for allowlisted Huang note paths only"
          echo "merge tip with untested Python still requires a prior/code push that ran full-suite"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.need_full == '1'
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝依賴
        if: steps.gate.outputs.need_full == '1'
        run: |
          python -m pip install --upgrade pip
          ok=0
          for i in 1 2 3 4 5; do
            if pip install --retries 10 --timeout 60 -r requirements.lock pytest; then
              ok=1
              break
            fi
            echo "pip install failed attempt=$i; retrying..."
            sleep $((i * 4))
          done
          test "$ok" = 1
          python -c "import kiwisolver, matplotlib; print('deps ok', kiwisolver.__version__)"

      - name: 從 Releases 下載核心資料庫
        if: steps.gate.outputs.need_full == '1'
        run: |
          mkdir -p data
          curl -fL -o waynebot_production_complete.zip \
            "https://github.com/wayne05281019/WayneBot/releases/download/v1.0-data/waynebot_production_complete.zip"
          unzip -o waynebot_production_complete.zip -d data_extract
          FOUND=$(find data_extract -name '*.db' -size +1M | head -n 1)
          test -n "$FOUND" || { echo "zip 內找不到 .db"; exit 1; }
          cp "$FOUND" data/wayne_market.db
          ls -l data/wayne_market.db

      - name: 確認庫是生產規模（否則 production_db 測試會安靜跳過）
        if: steps.gate.outputs.need_full == '1'
        run: |
          python - <<'PY'
          import os
          import sys

          sys.path.insert(0, "tests")
          from conftest import MIN_PRODUCTION_BYTES

          size = os.path.getsize("data/wayne_market.db")
          print(f"db size={size} threshold={MIN_PRODUCTION_BYTES}")
          if size < MIN_PRODUCTION_BYTES:
              sys.exit("庫太小，需要真實資料的測試會被跳過，等於沒測到")
          PY

      - name: 全套測試
        if: steps.gate.outputs.need_full == '1'
        env:
          WAYNE_DB_PATH: data/wayne_market.db
          MPLBACKEND: Agg
        # pipefail：pytest 紅要讓步驟失敗；tee 給下一步讀，不准再整包重跑 production_db
        run: |
          set -o pipefail
          python -m pytest -q --strict-markers -rs 2>&1 | tee /tmp/full-suite.txt

      - name: 確認需要真實資料的測試真的跑了
        if: steps.gate.outputs.need_full == '1'
        env:
          WAYNE_DB_PATH: data/wayne_market.db
          MPLBACKEND: Agg
        # 全套已含 production_db；步驟「確認庫是生產規模」已擋小庫跳過。
        # 舊式整包重跑 -m production_db ≈232 測／45–90 分，合主排程會拖垮。
        # 這裡只驗：全套 log 有 passed、庫仍夠大、production_db 標記可收集 ≥1。
        run: |
          grep -qE '[1-9][0-9]* passed' /tmp/full-suite.txt || {
            echo "全套 log 沒有 passed"
            exit 1
          }
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          sys.path.insert(0, "tests")
          from conftest import MIN_PRODUCTION_BYTES

          size = os.path.getsize("data/wayne_market.db")
          if size < MIN_PRODUCTION_BYTES:
              sys.exit(f"庫太小 size={size} threshold={MIN_PRODUCTION_BYTES}")
          out = subprocess.check_output(
              [
                  sys.executable,
                  "-m",
                  "pytest",
                  "--collect-only",
                  "-q",
                  "--strict-markers",
                  "-m",
                  "production_db",
              ],
              text=True,
          )
          print(out.strip().splitlines()[-1] if out.strip() else out)
          m = re.search(r"(\d+)/\d+ tests collected", out)
          if not m or int(m.group(1)) < 1:
              sys.exit("production_db 收集不到測試")
          print(f"production_db collected={m.group(1)} db_size={size}")
          PY
