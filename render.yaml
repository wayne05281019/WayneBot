services:
  - type: web
    name: waynebot-service
    runtime: python
    plan: 1c-2g
    disk:
      name: wayne-data
      mountPath: /opt/render/project/src/data
      sizeGB: 15
    # 裝完整鎖檔，否則傳遞相依會浮動，部署到的版本跟測過的不是同一份。
    # ffmpeg：黃培碩影音抽影格（看畫面）；yt-dlp／gdown 在 requirements.lock。
    # 原生 runtime 沒 root：apt-get／--with-deps 不能用。下面這行對齊 Dashboard 實際建置指令。
    # playwright chromium：低估 D3 HTML 渲圖。要裝完整 chromium（playwright_available 查 executable_path），
    # 放在 PLAYWRIGHT_BROWSERS_PATH（專案目錄內才會帶到執行期）。
    # 系統無中文字型：.fonts.conf 讓 fontconfig 讀 repo fonts/（FONTCONFIG_FILE 指向它）。
    buildCommand: pip install -r requirements.lock && python -m playwright install chromium && printf '<fontconfig><include ignore_missing="yes">/etc/fonts/fonts.conf</include><dir>/opt/render/project/src/fonts</dir><cachedir>/tmp/fc-cache</cachedir></fontconfig>' > /opt/render/project/src/.fonts.conf
    startCommand: python main.py
    # /health 只反映「行程能不能服務」；資料過期不會讓它變紅，
    # 因為重啟修不了資料管線，只會把互動 bot 一起弄掉。
    # /live 只回答「行程還在」；資料狀態走 /health 欄位與 /ready。
    # 健檢路徑必須 <1s，否則部署會被 Render 判 update_failed（#148 踩過）。
    healthCheckPath: /live
    envVars:
      # 與 .python-version／runtime.txt／CI 對齊；Dashboard 曾鎖 3.11.0 蓋過這三處。
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: WAYNE_RENDER_PLAN
        value: 1c-2g
      - key: WAYNE_RENDER_LITE
        value: "0"
      - key: WAYNE_UV_HTML
        value: "1"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.pw-browsers
      - key: FONTCONFIG_FILE
        value: /opt/render/project/src/.fonts.conf
      # 每個排程只能有一個擁有者。06:30 海選推播歸本服務（有效 token＋白名單兩人）。
      # GHA morning_screen 只算名單、蓋行情 zip，不寄。12:45 尾盤仍只在這裡。
      - key: WAYNE_SCHEDULER_ROLE
        value: data
      # 付費機磁碟上已有庫；寬限只擋「庫還沒可讀」的 503，不必拉到 15～30 分鐘。
      - key: WAYNE_BOOT_GRACE_SECONDS
        value: "600"
