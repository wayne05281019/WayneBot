services:
  - type: web
    name: waynebot-service
    runtime: python
    plan: 1c-2g
    disk:
      name: wayne-data
      mountPath: /opt/render/project/src/data
      sizeGB: 5
    # 裝完整鎖檔，否則傳遞相依會浮動，部署到的版本跟測過的不是同一份。
    buildCommand: pip install -r requirements.lock
    startCommand: python main.py
    # /health 只反映「行程能不能服務」；資料過期不會讓它變紅，
    # 因為重啟修不了資料管線，只會把互動 bot 一起弄掉。
    # /live 只回答「行程還在」；資料狀態走 /health 欄位與 /ready。
    # 健檢路徑必須 <1s，否則部署會被 Render 判 update_failed（#148 踩過）。
    healthCheckPath: /live
    envVars:
      - key: WAYNE_RENDER_PLAN
        value: 1c-2g
      - key: WAYNE_RENDER_LITE
        value: "0"
      # 每個排程只能有一個擁有者。GHA 是可靠的計時器（本服務會休眠），
      # 所以 06:30 海選推播歸 GHA；這裡只保持本機庫新鮮供互動查詢，
      # 並負責唯一沒有 GHA 對應的 12:45 尾盤複核。
      - key: WAYNE_SCHEDULER_ROLE
        value: data
      # 付費機磁碟上已有庫；寬限只擋「庫還沒可讀」的 503，不必拉到 15～30 分鐘。
      - key: WAYNE_BOOT_GRACE_SECONDS
        value: "600"
